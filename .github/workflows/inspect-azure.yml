name: Inspect Azure application
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect runtime
        shell: bash
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_APP_NAME }}
        run: |
          az webapp show -g "$RG" -n "$APP" --query '{host:defaultHostName,state:state,identity:identity.type}' -o json
          az webapp config show -g "$RG" -n "$APP" --query '{runtime:linuxFxVersion,webSockets:webSocketsEnabled,alwaysOn:alwaysOn,startup:appCommandLine}' -o json
          az webapp config appsettings list -g "$RG" -n "$APP" --query '[].name' -o json
          az webapp log deployment list -g "$RG" -n "$APP" -o json
          az webapp show -g "$RG" -n "$APP" --query '{principal:identity.principalId,outbound:outboundIpAddresses}' -o json
          az sql server show -g "$RG" -n takeda-server1 --query '{host:fullyQualifiedDomainName,network:publicNetworkAccess,administrators:administrators}' -o json
          az sql server firewall-rule list -g "$RG" -s takeda-server1 -o json
          az sql db show -g "$RG" -s takeda-server1 -n takeda-free-database --query '{status:status,free:useFreeLimit,limit:freeLimitExhaustionBehavior}' -o json
          az webapp config appsettings list -g "$RG" -n "$APP" -o json | python3 -c 'import json,sys; a={x["name"]:x["value"] for x in json.load(sys.stdin)}; c=a.get("ConnectionStrings__RacerSql",""); fields=dict(x.split("=",1) for x in c.split(";") if "=" in x); print(json.dumps({k:v for k,v in fields.items() if k.strip().lower() in ["server","database","authentication"]})); print("Production:",a.get("ASPNETCORE_ENVIRONMENT")=="Production")'