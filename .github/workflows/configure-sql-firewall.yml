name: Register App Service SQL firewall IPs
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: sql-firewall
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Register exact outbound IPs
        shell: bash
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_APP_NAME }}
          SQL: ${{ vars.AZURE_SQL_SERVER }}
        run: |
          set -euo pipefail
          ips=$(az webapp show -g "$RG" -n "$APP" --query "[outboundIpAddresses,possibleOutboundIpAddresses]" -o tsv | tr '\t\n' ',')
          ips="${ips},20.78.155.116"
          test -n "$ips"
          IFS=',' read -ra addresses <<< "$ips"
          for ip in "${addresses[@]}"; do
            [[ -z "$ip" ]] && continue
            python3 -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' "$ip"
            az sql server firewall-rule create -g "$RG" -s "$SQL" -n "app-outbound-${ip//./-}" --start-ip-address "$ip" --end-ip-address "$ip" -o none
            echo "Registered: $ip"
          done
          az sql server show -g "$RG" -n "$SQL" --query publicNetworkAccess -o tsv